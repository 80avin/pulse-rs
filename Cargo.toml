[workspace]
members = [
    "crates/pulse-core",
    "crates/pulse-cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = ["Avinash Thakur <iamavinashthakur.at@gmail.com>"]
license = "MIT"
repository = "https://github.com/80avin/pulse-rs"
homepage = "https://github.com/80avin/pulse-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# IDs
uuid = { version = "1", features = ["v4", "v5"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP — rustls-tls-native-roots uses OS certificate store (proxy CA support); stream for incremental download progress
reqwest = { version = "0.13", features = [
  "json",
  "rustls",
  "stream",
  "form",
], default-features = false }
rustls-platform-verifier = "0.7"

# Feed parsing
feed-rs = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Regex for rule engine
regex = "1"

# HTML stripping
scraper = "0.21"
